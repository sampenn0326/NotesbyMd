
hooks:
  - hooks/compact_math.py


# ======================================
# 网站基本信息
# ======================================

site_name: SamPenn

# ======================================
# 主题
# ======================================

theme:
  name: material

# ======================================
# 导航
# ======================================

nav:
  - 首页: index.md
  - 激光基础和技术:
      - 常见光束：激光基础和技术/常见光束形式.md
      - 超短脉冲的时域频域表征: 激光基础和技术/超短脉冲的时域频域表征.md
      - 飞行焦点: 激光基础和技术/飞行焦点.md
  - 激光与等离子体相互作用:                                     #一级导航
      - 快速手册: LaserPlasma/基本手册.md           #二级导航
      - SRS&SBS: 激光等离子体相互作用/SRS&SBS.md
      - 激光与物质相互作用: 离子加速/激光与物质相互作用.md
      - 离子加速: 离子加速/离子加速[笔记].md
      - 等离子体光学: 离子加速/等离子体光学.md
  - 数值方法: 
      - WarpX:
        - FieldSolver: 数值方法/FieldSolver.md
        - RZ: 数值方法/RZ坐标.md
      - MEEP: 数值方法/MEEP使用.md
      - WPM方法: 数值方法/WPM方法.md
  - Codes:
      - Jupyter: Codes/Jupyter.md                                 #AA:BB/CC.md AA为网站显示的导航栏，BB/CC.md为本地文件路径，以docs为根目录
      - C++: Codes/C++.md
      - Input: Codes/Input.md


# ======================================
# Markdown 扩展
# ======================================

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.superfences

# ======================================
# JavaScript
# ======================================

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# ======================================
# CSS
# ======================================

extra_css:
  - stylesheets/extra.css
  - stylesheets/pku-red.css