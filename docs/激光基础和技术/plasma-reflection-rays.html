<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>等离子体坡面的分频反射光线</title>
<style>
:root {
  color-scheme: light dark;
  --background: #fff;
  --foreground: #20242a;
  --muted: #e8ecf1;
  --muted-foreground: #626b76;
  --border: #d2d9e1;
  --red: #c02d32;
  --green: #197449;
  --blue: #245db8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: #1d2025;
    --foreground: #eff1f4;
    --muted: #393e47;
    --muted-foreground: #aeb7c3;
    --border: #48505c;
    --red: #ff7778;
    --green: #66d59a;
    --blue: #82b3ff;
  }
}
body { margin: 0; padding: 12px; font: 15px/1.45 system-ui, sans-serif; color: var(--foreground); background: var(--background); }
h3 { margin: 0 0 12px; font-size: 18px; }
.viz-controls { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 8px; }
.form-label { flex: 1 1 180px; }
.form-range { display: block; width: 100%; margin: 3px 0 0; }
.form-check { display: inline-block; margin-bottom: 6px; }
.viz-row { display: flex; flex-wrap: wrap; column-gap: 16px; row-gap: 2px; margin-top: 8px; }
</style>
<body>
<div id="plasma-rays-261119">
  <h3>等离子体坡面的分频反射光线</h3>
  <div class="viz-controls">
    <label class="form-label">坡面尺度 L · <output id="pr-lv">4</output> λ₀
      <input id="pr-l" class="form-range" type="range" min="2" max="60" step="0.5" value="4">
    </label>
    <label class="form-label">横向尺度 b · <output id="pr-bv">12</output> λ₀
      <input id="pr-b" class="form-range" type="range" min="4" max="180" step="1" value="12">
    </label>
  </div>
  <label class="form-check"><input id="pr-stretch" class="form-check-input" type="checkbox"> <span class="form-check-label">纵向自动适配（横纵比例可不同）</span></label>
  <svg id="pr-plot" role="img" aria-label="各频率的入射、转向和回到真空后的反射光线" style="width:100%;height:355px;display:block"></svg>
  <div id="pr-key" class="viz-row" aria-live="polite"></div>
</div>
<script>
(() => {
 const root = document.getElementById('plasma-rays-261119');
 const el = id => root.querySelector('#pr-' + id);
 const svg = el('plot');
 const frequencies = [.85, 1, 1.15];
 const colors = ['var(--red)', 'var(--green)', 'var(--blue)'];
 function trace(a,b,y0) {
   let z = [0,y0/a,1,0];
   const ratio = a/b, dt = .0125, path = [[0,y0]];
   function rhs([x,y,px,py]) {
     const d = 1 - (ratio*y)**2;
     return [px,py,-x/(d*d),-2*x*x*y*ratio*ratio/(d*d*d)];
   }
   const add = (v,k,s) => v.map((q,i) => q+s*k[i]);
   for(let i=0;i<700;i++) {
     const k=rhs(z), l=rhs(add(z,k,dt/2)), m=rhs(add(z,l,dt/2)), n=rhs(add(z,m,dt));
     const next=z.map((q,j)=>q+dt*(k[j]+2*l[j]+2*m[j]+n[j])/6);
     if(next[0]<=0) {
       const end=z.map((q,j)=>q+(next[j]-q)*z[0]/(z[0]-next[0]));
       path.push([0,a*end[1]]);
       return {path, y:a*end[1], slope:end[3]/end[2]};
     }
     path.push([a*next[0],a*next[1]]);
     z=next;
   }
   return {path, y:NaN, slope:NaN};
 }
 function draw() {
   const L=+el('l').value, b=+el('b').value;
   el('lv').textContent=L; el('bv').textContent=b;
   const W=Math.round(svg.clientWidth);
   if(W<100) return;
   const H=355, ml=54, mr=16, mt=28, mb=43;
   const pw=W-ml-mr, ph=H-mt-mb;
   const series=frequencies.map(u=>{
     const a=L*u, near=trace(a,b,.00001*b);
     const focus=-near.y/near.slope;
     return {u,a,focus,rays:[.12,.25].map(h=>trace(a,b,h*b))};
   });
   const virtualOrLong = s => Number.isFinite(s.focus) && s.focus<0 && -s.focus<=Math.max(10*L,3*b);
   const left=Math.max(2*L, .65*b, ...series.filter(virtualOrLong).map(s=>-1.22*s.focus));
   let xmin=-left, xmax=1.45*L, ymax=.36*b;
   if(!el('stretch').checked) {
     const scale=Math.min(pw/(xmax-xmin),ph/(2*ymax));
     const cx=(xmin+xmax)/2;
     xmin=cx-pw/(2*scale); xmax=cx+pw/(2*scale); ymax=ph/(2*scale);
   }
   const X=x=>ml+(x-xmin)*pw/(xmax-xmin), Y=y=>mt+(ymax-y)*ph/(2*ymax);
   const fmt=n=>Number(n.toPrecision(3)).toString();
   const ticks=(lo,hi,count)=>{
     const target=(hi-lo)/count, p=10**Math.floor(Math.log10(target));
     const step=[1,2,5,10].find(q=>q*p>=target)*p;
     return Array.from({length:Math.floor(hi/step)-Math.ceil(lo/step)+1},(_,i)=>(Math.ceil(lo/step)+i)*step);
   };
   let grid='';
   for(const x of ticks(xmin,xmax,W<500?4:7)) {
     grid+=`<path d="M${X(x)},${mt}v${ph}" stroke="var(--border)"/><text x="${X(x)}" y="${H-22}" text-anchor="middle">${fmt(x)}</text>`;
   }
   const yt=ticks(-ymax,ymax,6);
   for(const y of yt) {
     grid+=`<path d="M${ml},${Y(y)}h${pw}" stroke="var(--border)"/><text x="${ml-6}" y="${Y(y)+4}" text-anchor="end">${fmt(y)}</text>`;
   }
   let paths=`<rect x="${X(0)}" y="${mt}" width="${X(xmax)-X(0)}" height="${ph}" fill="var(--muted)" opacity=".4"/>
     <path d="M${X(0)},${mt}v${ph} M${ml},${Y(0)}h${pw}" stroke="var(--muted-foreground)" opacity=".6"/>`;
   const poly=points=>points.map(([x,y])=>`${X(x).toFixed(2)},${Y(y).toFixed(2)}`).join(' ');
   for(const h of [-.25,-.12,.12,.25]) {
     const y=h*b, tip=xmin+.14*(0-xmin);
     paths+=`<path d="M${X(xmin)},${Y(y)}H${X(0)} M${X(tip)-6},${Y(y)-3}L${X(tip)},${Y(y)}l-6,3" fill="none" stroke="var(--muted-foreground)" opacity=".65"/>`;
   }
   series.forEach((s,i)=>{
     const color=colors[i];
     const contour=Array.from({length:81},(_,j)=>{const y=(j/40-1)*.35*b;return [s.a*(1-(y/b)**2),y]});
     paths+=`<polyline points="${poly(contour)}" fill="none" stroke="${color}" opacity=".42"/>`;
     for(const ray of s.rays) for(const sign of [-1,1]) {
       const points=[];
       let crossed=false;
       for (const [x,y] of ray.path) {
         if (y<=0 && points.length) {
           const [previousX,previousY]=points.at(-1);
           const fraction=previousY/(previousY-y);
           points.push([previousX+fraction*(x-previousX),0]);
           crossed=true;
           break;
         }
         points.push([x,y]);
       }
       if (!crossed && Number.isFinite(ray.y)) {
         const crossing=-ray.y/ray.slope;
         const endX=crossing<0 && crossing>=xmin ? crossing : xmin;
         points.push([endX,endX===crossing ? 0 : ray.y+ray.slope*endX]);
       }
       paths+=`<polyline points="${poly(points.map(([x,y])=>[x,sign*y]))}" fill="none" stroke="${color}" stroke-width="1.55"/>`;
     }
     if(virtualOrLong(s)) {
       const x=X(s.focus), y=Y(0);
       paths+=`<circle cx="${x}" cy="${y}" r="${4+i}" fill="var(--background)" stroke="${color}" stroke-width="1.7"/>`;
     }
   });
   svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
   svg.innerHTML=`<defs><clipPath id="pr-frame"><rect x="${ml}" y="${mt}" width="${pw}" height="${ph}"/></clipPath></defs>
     <g fill="var(--foreground)" font-size="12">${grid}
       <g clip-path="url(#pr-frame)">${paths}</g>
       <rect x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="none" stroke="var(--border)"/>
       <text x="${ml}" y="17">y / λ₀</text><text x="${W-mr}" y="${H-4}" text-anchor="end">x / λ₀</text>
     </g>`;
   el('key').innerHTML=series.map((s,i)=>`<span><span aria-hidden="true" style="color:${colors[i]}">●</span> u=${s.u.toFixed(2)} · ${s.focus<0?'xₑ='+fmt(s.focus)+' λ₀'+(virtualOrLong(s)?'':'（图外）'):'无真空近轴交点'}</span>`).join('');
 }
 for(const id of ['l','b','stretch']) el(id).addEventListener('input',draw);
 new ResizeObserver(draw).observe(svg);
 draw();
})();
</script>
</body>
</html>
